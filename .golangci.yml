version: "2"
linters:
  default: all
  disable:
    - depguard
    - tagalign # golinesのreformat-tagsと競合するため
    - exhaustruct
    - cyclop
  settings:
    varnamelen:
      ignore-names:
        - tt
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - testpackage
          - funlen
          - lll
formatters:
  enable:
    - gofumpt
    - gci
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
