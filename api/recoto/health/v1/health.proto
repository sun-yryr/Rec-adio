syntax = "proto3";

package recoto.health.v1;

option go_package = "github.com/sun-yryr/recoto/pkg/api/health/v1;healthv1";

service HealthService {
  rpc Check(CheckRequest) returns (CheckResponse) {}
}

message CheckRequest {}

message CheckResponse {
  string status = 1;
  repeated CheckResult results = 2;
}

message CheckResult {
  string name = 1;
  string error = 2;
  bool ok = 3;
}
